<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>UnitHub</title>
        <link rel="stylesheet" th:href="@{/css/selecao_de_modulos.css}">
        <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    </head>
    
    <body>
            <div id="superior" class="d-flex justify-content-between align-items-center px-5 py-3">
                <div> <img th:src="@{/imgs/logo_full.png}" alt="" id="logo"> </div>
            </div>
            <main>
                <div>
                    <h1>CADASTRO</h1>
                    <h3 class="ms-3">SELECIONE SEUS MÓDULOS</h3>
                </div>

                <main>
                    
                    <div th:each="m : ${modulos}" th:id="${m.id}" class="modulo nao_selecionado">
                        <img th:src="${m.imagem}" alt="a">
                        <div>
                            <h5 th:text="${m.nome}"></h5>
                            <h6 th:text="${m.descricao}"></h6>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <input id="salvar" type="button" value="SALVAR">
                    </div>

                    <!-- MODAL DE CONFIRMAÇÃO DE ENVIO -->
                    <div class="modal fade" id="meuModal" tabindex="-1">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">

                                <div class="modal-header">
                                    <h3 class="modal-title" id="tituloModal"></h3>

                                    <button type="button"
                                            class="btn-close"
                                            data-bs-dismiss="modal">
                                    </button>
                                </div>

                                <div id="conteudoModal" class="modal-body d-flex gap-4">
                                    
                                    
                                </div>

                            </div>
                        </div>
                    </div>

                </main>

            </main>
    </body>

    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/selecao_de_modulos.js}"></script>
</html>
