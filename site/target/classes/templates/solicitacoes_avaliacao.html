<!DOCTYPE html>
<html lang="en">
    
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>UnitHub</title>
        <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/css/solicitacoes_avaliacao.css}">
    </head>
    
    <body>
            <div id="superior" class="d-flex justify-content-between align-items-center px-5 py-3">
                <div> <img th:src="@{/imgs/logo_full.png}" alt="" id="logo"> </div>
                <div id="usuario_infos"> <button id="usuario_foto"><img src="" alt=""></button> <span>nome</span> </div>
            </div>

            <main>
                <div>
                    <h1>MASTERBOARD</h1>
                    <h3 class="ms-3">SOLICITAÇÕES PENDENTES: NOVAS EMPRESAS</h3>
                </div><br><br>
                <div id="empresas" class="d-flex flex-column accordion">
                    

                    <!-- accordions -->
                    <div class="accordion-item ms-3 mb-5">
                        <h2 class="accordion-header" id="headingOne">
                            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseDois" aria-controls="collapseDois">
                                <div><h3>NOME DA EMPRESA</h3> <p>data</p></div>
                            </button>
                        </h2>
                        <div id="collapseDois" class="accordion-collapse collapse" aria-labelledby="headingOne" data-bs-parent="#accordionExample">
                            <div class="accordion-body">
                                <div class="info d-flex flex-row gap-3">
                                    <div class="empresa_infos w-50" >
                                        <div> <h3>Razão social:</h3> <span>TEXTO</span> </div>
                                        <div> <h3>Nome:</h3>  <span>TEXTO</span></div>
                                        <div> <h3>Email:</h3>  <span>TEXTO</span></div>
                                        <div> <h3>Endereço:</h3>  <span>TEXTO</span></div>
                                    </div>
                                    <div class="empresa_infos w-50">
                                        <div> <h3>CNPJ:</h3>  <span>TEXTO</span></div>
                                        <div> <h3>Telefone:</h3>  <span>TEXTO</span></div>
                                    </div>
                                </div><br>
                                <div class="inputs d-flex justify-content-end gap-3">
                                    <input type="button" class="rejeitar_btn" value="REJEITAR">
                                    <input type="button" class="aprovar_btn" value="APROVAR">
                                </div>
                            </div>
                        </div>
                    </div>


                </div>
            </main>
    </body>

    <script th:src="@{/js/solicitacoes_avaliacao.js}"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</html>
