<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/css/navegacao_modulo.css}">
        <title>UnitHub</title>
        <style th:text="'.opcao:hover { background-color: color-mix(in srgb, ' + ${e.getCor()} + ' 70%, white); }'"></style>
    </head>
    <body>

        <header>
            <div id="superior" th:style=" 'background-color: ' + ${e.getCor} + ';'" class="d-flex justify-content-between align-items-center px-5 py-3">
                <div> <img th:src="@{${e.getFoto}}" alt="" id="logo"> </div>
                <div id="usuario_infos"> <button id="usuario_foto"><img th:src="@{/imgs/foto.png}" alt=""></button> <span th:text="${u.nome}" >nome</span> </div>
            </div>
        </header>

        <main>
            <h3><strong>HUB ADMINISTRATIVO</strong></h3>
            <section>
                <div th:if="${modulos_ids.contains(2L)}">
                    <h6>RECURSOS HUMANOS</h6>
                    <div class="opcoes">
                        <button class="opcao" id="quadro_funcionarios_btn">
                            <img th:src="@{/imgs/quadrofuncionarios.png}">
                            <div class="botao_titulo">
                                <span><strong>QUADRO DE</strong></span>
                                <span>FUNCIONÁRIO</span>
                            </div>
                        </button>
                        <button class="opcao" id="folha_pagamento_btn">
                            <img th:src="@{/imgs/pagamento.png}">
                            <div class="botao_titulo">
                                <span><strong>CONTROLE DE</strong></span>
                                <span>FOLHA DE PAGAMENTO</span>
                            </div>
                        </button>
                        <button class="opcao" id="banco_horas_btn">
                            <img th:src="@{/imgs/calendario.png}">
                            <div class="botao_titulo">
                                <span><strong>BANCO DE HORAS E</strong></span>
                                <span>CALENDÁRIO DE FÉRIAS</span>
                            </div>
                        </button>
                        <button class="opcao" id="beneficios_btn">
                            <img th:src="@{/imgs/beneficio.png}">
                            <div class="botao_titulo">
                                <span><strong>GERENCIADOR DE</strong></span>
                                <span>BENEFÍCIOS</span>
                            </div>
                        </button>
                        <button class="opcao" id="funcionarios_relatorio_btn">
                            <img th:src="@{/imgs/funcionarios_report.png}">
                            <div class="botao_titulo">
                                <span><strong>RELATORIO DE</strong></span>
                                <span>FUNCIONÁRIOS</span>
                            </div>
                        </button>
                    </div>
                    <script th:src="@{/js/nav_modulos_lnks/rh.js}"></script> 
                </div>
                <div th:if="${modulos_ids.contains(1L)}">
                    <h6>FINANCEIRO</h6>
                    <div class="opcoes">
                        <button class="opcao" id="geren_despesas_btn">
                            <img th:src="@{/imgs/pagamentoexterno.png}">
                            <div class="botao_titulo">
                                <span><strong>GERENCIADOR DE</strong></span>
                                <span>DESPESAS</span>
                            </div>
                        </button>
                        <button class="opcao" id="valores_receber_btn">
                            <img th:src="@{/imgs/receber.png}">
                            <div class="botao_titulo">
                                <span><strong>GERENCIADOR DE</strong></span>
                                <span>VALORES A RECEBER</span>
                            </div>
                        </button>
                        <button class="opcao" id="fluxo_caixa_btn">
                            <img th:src="@{/imgs/fluxodecaixa.png}">
                            <div class="botao_titulo">
                                <span><strong>RELATÓRIO DE</strong></span>
                                <span>FLUXO DE CAIXA</span>
                            </div>
                        </button>
                        <button class="opcao" id="centro_custos_btn">
                            <img th:src="@{/imgs/centrodecustos.png}">
                            <div class="botao_titulo">
                                <span><strong>VISUALIZAÇÃO DE</strong></span>
                                <span>CENTROS DE CUSTO</span>
                            </div>
                        </button>
                    </div>
                </div>
                <div th:if="${modulos_ids.contains(4L)}">
                    <h6>ESTOQUE</h6>
                    <div class="opcoes">
                        <button class="opcao" id="cadas_produtos_btn">
                            <img th:src="@{/imgs/produto.png}">
                            <div class="botao_titulo">
                                <span><strong>CADASTRO DE</strong></span>
                                <span>PRODUTOS</span>
                            </div>
                        </button>
                        <button class="opcao" id="registro_inventario_btn">
                            <img th:src="@{/imgs/inventario.png}">
                            <div class="botao_titulo">
                                <span><strong>REGISTRO DE</strong></span>
                                <span>INVENTÁRIO</span>
                            </div>
                        </button>
                        <button class="opcao" id="relatorio_inventario_btn">
                            <img th:src="@{/imgs/relatorioinventario.png}">
                            <div class="botao_titulo">
                                <span><strong>RELATÓRIO DE</strong></span>
                                <span>INVENTÁRIO</span>
                            </div>
                        </button>
                    </div>
                </div>
                <div th:if="${modulos_ids.contains(3L)}">
                    <h6>COMERCIAL</h6>
                    <div class="opcoes">
                        <button class="opcao" id="relatorio_clientes_btn">
                            <img th:src="@{/imgs/clientes.png}">
                            <div class="botao_titulo">
                                <span><strong>RELATÓRIO DE</strong></span>
                                <span>CLIENTES</span>
                            </div>
                        </button>
                        <button class="opcao" id="registro_vendas_btn">
                            <img th:src="@{/imgs/venda.png}">
                            <div class="botao_titulo">
                                <span><strong>REGISTRO</strong></span>
                                <span>DE VENDAS</span>
                            </div>
                        </button>
                        <button class="opcao" id="doc_comercial_btn">
                            <img th:src="@{/imgs/contrato.png}">
                            <div class="botao_titulo">
                                <span><strong>DOCUMENTAÇÃO</strong></span>
                                <span>COMERCIAL</span>
                            </div>
                        </button>
                    </div>
                </div>
                <div>
                    <h6>SUPORTE</h6>
                    <div class="opcoes">
                        <button class="opcao" id="conf_ecossistema_btn">
                            <img th:src="@{/imgs/configuracao.png}">
                            <div class="botao_titulo">
                                <span><strong>CONFIGURAÇÃO DE</strong></span>
                                <span>ECOSSISTEMA</span>
                            </div>
                        </button>
                        <button class="opcao" id="solic_admissao_btn">
                            <img th:src="@{/imgs/admissao.png}">
                            <div class="botao_titulo">
                                <span><strong>SOLICITAÇÃO DE</strong></span>
                                <span>ADMISSÃO</span>
                            </div>
                        </button>
                        <button class="opcao" id="alter_modulos_btn">
                            <img th:src="@{/imgs/modulos 2.png}">
                            <div class="botao_titulo">
                                <span><strong>ALTERAÇÃO DE</strong></span>
                                <span>MÓDULOS FUNCIONAIS</span>
                            </div>
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </body> 

    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/navegacao_modulos.js}"></script>
</html>
