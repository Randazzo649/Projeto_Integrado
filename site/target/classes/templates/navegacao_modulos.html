<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/css/navegacao_modulo.css}">
        <title>UnitHub</title>
    </head>
    <body>

        <header>
            <img th:src="@{/imgs/logo_full.png}">
            <img id="logo_empresa" th:src="@{/imgs/logo_full.png}">
        </header>

        <main>
            <h1><strong>HUB ADMINISTRATIVO</strong></h1>
            <section>
                <div th:if="${modulos_ids.contains(2L)}">
                    <h3>RECURSOS HUMANOS</h3>
                    <div class="opcoes">
                        <button class="opcao" id="quadro_funcionarios_btn">
                            <img th:src="@{/imgs/quadrofuncionarios.png}">
                            <div class="botao_titulo">
                                <h6><strong>QUADRO DE</strong></h6>
                                <h6>FUNCIONÁRIOS</h6>
                            </div>
                        </button>
                        <button class="opcao" id="folha_pagamento_btn">
                            <img th:src="@{/imgs/pagamento.png}">
                            <div class="botao_titulo">
                                <h6><strong>CONTROLE DE</strong></h6>
                                <h6>FOLHA DE PAGAMENTO</h6>
                            </div>
                        </button>
                        <button class="opcao" id="banco_horas_btn">
                            <img th:src="@{/imgs/calendario.png}">
                            <div class="botao_titulo">
                                <h6><strong>BANCO DE HORAS E</strong></h6>
                                <h6>CALENDÁRIO DE FÉRIAS</h6>
                            </div>
                        </button>
                        <button class="opcao" id="beneficios_btn">
                            <img th:src="@{/imgs/beneficio.png}">
                            <div class="botao_titulo">
                                <h6><strong>GERENCIADOR DE</strong></h6>
                                <h6>BENEFÍCIOS</h6>
                            </div>
                        </button>
                    </div>
                </div>
                <div th:if="${modulos_ids.contains(1L)}">
                    <h3>FINANCEIRO</h3>
                    <div class="opcoes">
                        <button class="opcao" id="geren_despesas_btn">
                            <img th:src="@{/imgs/pagamentoexterno.png}">
                            <div class="botao_titulo">
                                <h6><strong>GERENCIADOR DE</strong></h6>
                                <h6>DESPESAS</h6>
                            </div>
                        </button>
                        <button class="opcao" id="valores_receber_btn">
                            <img th:src="@{/imgs/receber.png}">
                            <div class="botao_titulo">
                                <h6><strong>GERENCIADOR DE</strong></h6>
                                <h6>VALORES A RECEBER</h6>
                            </div>
                        </button>
                        <button class="opcao" id="fluxo_caixa_btn">
                            <img th:src="@{/imgs/fluxodecaixa.png}">
                            <div class="botao_titulo">
                                <h6><strong>RELATÓRIO DE</strong></h6>
                                <h6>FLUXO DE CAIXA</h6>
                            </div>
                        </button>
                        <button class="opcao" id="centro_custos_btn">
                            <img th:src="@{/imgs/centrodecustos.png}">
                            <div class="botao_titulo">
                                <h6><strong>VISUALIZAÇÃO DE</strong></h6>
                                <h6>CENTROS DE CUSTO</h6>
                            </div>
                        </button>
                    </div>
                </div>
                <div th:if="${modulos_ids.contains(4L)}">
                    <h3>ESTOQUE</h3>
                    <div class="opcoes">
                        <button class="opcao" id="cadas_produtos_btn">
                            <img th:src="@{/imgs/produto.png}">
                            <div class="botao_titulo">
                                <h6><strong>CADASTRO DE</strong></h6>
                                <h6>PRODUTOS</h6>
                            </div>
                        </button>
                        <button class="opcao" id="registro_inventario_btn">
                            <img th:src="@{/imgs/inventario.png}">
                            <div class="botao_titulo">
                                <h6><strong>REGISTRO DE</strong></h6>
                                <h6>INVENTÁRIO</h6>
                            </div>
                        </button>
                        <button class="opcao" id="relatorio_inventario_btn">
                            <img th:src="@{/imgs/relatorioinventario.png}">
                            <div class="botao_titulo">
                                <h6><strong>RELATÓRIO DE</strong></h6>
                                <h6>INVENTÁRIO</h6>
                            </div>
                        </button>
                    </div>
                </div>
                <div th:if="${modulos_ids.contains(3L)}">
                    <h3>COMERCIAL</h3>
                    <div class="opcoes">
                        <button class="opcao" id="relatorio_clientes_btn">
                            <img th:src="@{/imgs/clientes.png}">
                            <div class="botao_titulo">
                                <h6><strong>RELATÓRIO DE</strong></h6>
                                <h6>CLIENTES</h6>
                            </div>
                        </button>
                        <button class="opcao" id="registro_vendas_btn">
                            <img th:src="@{/imgs/venda.png}">
                            <div class="botao_titulo">
                                <h6><strong>REGISTRO</strong></h6>
                                <h6>DE VENDAS</h6>
                            </div>
                        </button>
                        <button class="opcao" id="doc_comercial_btn">
                            <img th:src="@{/imgs/contrato.png}">
                            <div class="botao_titulo">
                                <h6><strong>DOCUMENTAÇÃO</strong></h6>
                                <h6>COMERCIAL</h6>
                            </div>
                        </button>
                    </div>
                </div>
                <div>
                    <h3>SUPORTE</h3>
                    <div class="opcoes">
                        <button class="opcao" id="conf_ecossistema_btn">
                            <img th:src="@{/imgs/configuracao.png}">
                            <div class="botao_titulo">
                                <h6><strong>CONFIGURAÇÃO DE</strong></h6>
                                <h6>ECOSSISTEMA</h6>
                            </div>
                        </button>
                        <button class="opcao" id="solic_admissao_btn">
                            <img th:src="@{/imgs/admissao.png}">
                            <div class="botao_titulo">
                                <h6><strong>SOLICITAÇÃO DE</strong></h6>
                                <h6>ADMISSÃO</h6>
                            </div>
                        </button>
                        <button class="opcao" id="alter_modulos_btn">
                            <img th:src="@{/imgs/modulos 2.png}">
                            <div class="botao_titulo">
                                <h6><strong>ALTERAÇÃO DE</strong></h6>
                                <h6>MÓDULOS FUNCIONAIS</h6>
                            </div>
                        </button>
                    </div>
                </div>
            </section>
        </main>
    </body>
</html>
