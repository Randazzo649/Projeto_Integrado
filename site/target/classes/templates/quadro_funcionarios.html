<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>UnitHub</title>

        <link rel="stylesheet" th:href="@{/css/visualizacao_funcionarios.css}">
        <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    </head>

    <body>
        <header>
            <div id="superior" th:style=" 'background-color: ' + ${e.getCor} + ';'" class="d-flex justify-content-between align-items-center px-5 py-3">
                <div> <img th:src="@{${e.getFoto}}" alt="" id="logo"> </div>
                <div id="usuario_infos"> <button id="usuario_foto"><img th:src="@{/imgs/foto.png}" alt=""></button> <span th:text="${u.nome}" >nome</span> </div>
            </div>
        </header>

        <main>
            <div id="titulo_pagina">
                <h1>DASHBOARD</h1>
                <h3>QUADRO DE FUNCIONÁRIOS</h3>
            </div>
            <button type="button" id="registrar_funcionario">REGISTRAR NOVO FUNCIONÁRIO</button>
            
            <section id="secao_funcionarios">
                <h4>FUNCIONÁRIOS</h4>

                <div id="lista_funcionarios">
                    <div class="accordion funcionario_accordion">
                        <!-- INICIO DO ACCORDION -->
                        <div th:each=" func : ${funcs} " class="funcionario accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" th:data-bs-target="'#funcionario_' + ${func.id}" aria-expanded="false" th:aria-controls="'funcionario_' + ${func.id}">
                                    <div class="funcionario_header">
                                        <div>
                                            <strong th:text="${func.nome}" >NOME DO FUNCIONÁRIO</strong>
                                            <span th:text="${func.nomeDepartamento}">DEPARTAMENTO</span>
                                        </div>
                                    </div>
                                </button>
                            </h2>
                            <div th:id="'funcionario_' + ${func.id}" class="accordion-collapse collapse">
                                <div class="accordion-body">

                                    <form id="form_funcionario">
                                        <div id="formulario">

                                            <div class="linha">
                                                <div class="campo campo_nome">
                                                    <label for="nome">Nome</label>
                                                    <input type="text" th:value="${func.nome}" id="nome" name="nome" placeholder="Nome Sobrenome Último Nome" required>
                                                </div>
                                                <div class="campo">
                                                    <label for="data_nascimento">Data de Nascimento</label>
                                                    <input type="text" th:value="${func.data_nascimento}" id="data_nascimento" name="data_nascimento" placeholder="XX/XX/XXXX" required>
                                                </div>
                                            </div>
                                            <div class="linha">
                                                <div class="campo">
                                                    <label for="cpf">CPF</label>
                                                    <input type="text" th:value="${func.cpf}" id="cpf" name="cpf" placeholder="XXX.XXX.XXX-XX" required>
                                                </div>
                                                <div class="campo">
                                                    <label for="genero">Gênero</label>
                                                    <input type="text" th:value="${func.genero}" id="genero" name="genero">
                                                </div>
                                                <div class="campo">
                                                    <label for="telefone">Telefone</label>
                                                    <input type="text" th:value="${func.telefone}" id="telefone" name="telefone">
                                                </div>
                                            </div>
                                            <div class="campo campo_endereco">
                                                <label for="endereco">
                                                    <span>Endereço</span>
                                                    <small>Logradouro, Número, Complemento, Bairro, Cidade, Estado, CEP</small>
                                                </label>
                                                <input type="text" th:value="${func.endereco}" id="endereco" name="endereco" required>
                                            </div>
                                            <div class="linha">
                                                <div class="campo">
                                                    <label for="data_admissao">Data de Admissão</label>
                                                    <input type="text" th:value="${func.data_admissao}" id="data_admissao" name="data_admissao" placeholder="XX/XX/XXXX" required>
                                                </div>
                                                <div class="campo">
                                                    <label for="cargo">Cargo</label>
                                                    <input type="text" th:value="${func.cargo}" id="cargo" name="cargo" required>
                                                </div>
                                                <div class="campo">
                                                    <label for="departamento">Departamento</label>
                                                    <input type="text" th:value="${func.nomeDepartamento}" id="departamento" name="departamento" required>
                                                </div>
                                                <div class="campo">
                                                    <label for="salario">Salário</label>
                                                    <input type="text" th:value="${func.salario}" id="salario" name="salario" required>
                                                </div>
                                            </div>
                                            <div class="linha">
                                                <div class="campo campo_email">
                                                    <label for="email">E-Mail</label>
                                                    <input type="email" th:value="${func.email}" id="email" name="email" required>
                                                </div>
                                                <div class="campo campo_senha">
                                                    <label for="senha">Senha</label>
                                                    <input type="password" id="senha" name="senha" required>
                                                </div>
                                            </div>
                                            <div id="botoes">
                                                <button type="button" id="remover">REMOVER</button>
                                                <button type="submit" id="salvar">SALVAR</button>
                                            </div>

                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                        <!-- FIM DO ACCORDION -->
                    </div>
                </div>
            </section>
        </main>

        
    </body>

    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/quadro_funcionarios.js}"></script>
</html>
