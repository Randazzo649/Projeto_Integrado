<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/personalizacao_empresa.css}">
    <title>UnitHub</title>
</head>
<body>
    <header>
        <img th:src="@{/imgs/logo_full.png}">
        <img id="logo_empresa" th:src="@{/imgs/logo_full.png}">
    </header>
    <main>
        <h1><strong>DASHBOARD</strong></h1>
        <div class="opcoes">
            <h2>CONFIGURAÇÃO DE ECOSSISTEMA</h2>
            <div class="funcionalidades">
                <div class="seletor_cor">
                    <h3>SELETOR DE COR</h3>
                    <div id="area_cor">
                        <div id="seletor_cor"></div>
                    </div>
                    <div id="barra_matriz">
                        <div id="seletor_matriz"></div>
                    </div>
                    <div class="campos_cor">
                        <div>
                            <label>HEX</label>
                            <input id="hex" type="text" readonly>
                        </div>
                        <div>
                            <label>RGB</label>
                            <input id="rgb" type="text" readonly>
                        </div>
                        <div>
                            <label>HSL</label>
                            <input id="hsl" type="text" readonly>
                        </div>
                    </div>
                </div>
                <div class="alterar_logo">
                    <h3>ALTERAR LOGO</h3>
                    <button id="alterar_logo_btn">
                        <img th:src="@{/imgs/upload.png}">
                        <p>
                            <strong>
                                Clique ou Arraste<br>
                                seus arquivos aqui<br>
                            </strong>
                            (PNG, SVG, PDF)
                        </p>
                    </button>
                </div>
            </div>
        </div>
    </main>
    <script th:src="@{/js/editor_cor.js}"></script>
</body>
</html>
