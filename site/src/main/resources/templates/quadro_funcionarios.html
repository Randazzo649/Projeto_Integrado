<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>UnitHub</title>

        <link rel="stylesheet" th:href="@{/css/visualizacao_funcionarios.css}">
        <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    </head>

    <body>
        <header>
            <div id="superior" th:style=" 'background-color: ' + ${e.getCor} + ';'" class="d-flex justify-content-between align-items-center px-5 py-3">
                <div>
                    <img th:src="@{${e.getFoto}}" alt="" id="logo">
                </div>
                <div id="usuario_infos"> 
                    <button id="usuario_foto" th:if="${u.foto != null}"><img id="usuario_foto_img" th:src="@{${u.foto}}" alt=""></button>
                    <button id="usuario_foto" th:if="${u.foto == null}"><img id="usuario_foto_img" th:src="@{/imgs/foto.png}" alt=""></button> 
                    <span th:text="${u.nome}">nome</span>
                </div>
            </div>
        </header>

        <main>
            <div id="titulo_pagina">
                <h1>DASHBOARD</h1>
                <h3>QUADRO DE FUNCIONÁRIOS</h3>
            </div>
            <button type="button" id="registrar_funcionario">REGISTRAR NOVO FUNCIONÁRIO</button>
            
            <section id="secao_funcionarios">
                <h4>FUNCIONÁRIOS</h4>

                <div id="lista_funcionarios">
                    <div class="accordion funcionario_accordion">
                        <!-- INICIO DO ACCORDION -->
                        <div th:each=" func : ${funcs} " class="funcionario accordion-item">
                            <h2 class="accordion-header">
                                <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" th:data-bs-target="'#funcionario_' + ${func.id}" aria-expanded="false" th:aria-controls="'funcionario_' + ${func.id}">
                                    <div class="funcionario_header">
                                        <div>
                                            <strong th:text="${func.nome}" >NOME DO FUNCIONÁRIO</strong>
                                            <span th:text="${func.nomeDepartamento}">DEPARTAMENTO</span>
                                        </div>
                                    </div>
                                </button>
                            </h2>
                            <div th:id="'funcionario_' + ${func.id}" class="accordion-collapse collapse">
                                <div class="accordion-body">

                                    <div id="form_funcionario">
                                        <div id="formulario">

                                            <div class="linha">
                                                <div class="campo campo_nome">
                                                    <label for="nome">Nome</label>
                                                    <input type="text" th:value="${func.nome}" th:id="'nome_'+${func.id}" name="nome" placeholder="Nome Sobrenome Último Nome" required>
                                                </div>
                                                <div class="campo">
                                                    <label for="data_nascimento">Data de Nascimento</label>
                                                    <input type="text" th:value="${func.data_nascimento}" th:id="'data_nascimento_'+${func.id}" name="data_nascimento" placeholder="XX/XX/XXXX" required>
                                                </div>
                                            </div>
                                            <div class="linha">
                                                <div class="campo">
                                                    <label for="cpf">CPF</label>
                                                    <input type="text" th:value="${func.cpf}" th:id="'cpf_'+${func.id}" name="cpf" th:oninput="'formatarCpf(' + ${func.id} + ')'" placeholder="XXX.XXX.XXX-XX" required>
                                                </div>
                                                <div class="campo">
                                                    <label for="genero">Gênero</label>
                                                    <input type="text" th:value="${func.genero}" th:id="'genero_'+${func.id}" name="genero">
                                                </div>
                                                <div class="campo">
                                                    <label for="telefone">Telefone</label>
                                                    <input type="text" th:value="${func.telefone}" th:id="'telefone_'+${func.id}" name="telefone" th:oninput="'formatarTelefone(' + ${func.id} + ')'" >
                                                </div>
                                            </div>
                                            <div class="campo campo_endereco">
                                                <label for="endereco">
                                                    <span>Endereço</span>
                                                    <small>Logradouro, Número, Complemento, Bairro, Cidade, Estado, CEP</small>
                                                </label>
                                                <input type="text" th:value="${func.endereco}" th:id="'endereco_'+${func.id}" name="endereco" required>
                                            </div>
                                            <div class="linha">
                                                <div class="campo">
                                                    <label for="data_admissao">Data de Admissão</label>
                                                    <input type="text" th:value="${func.data_admissao}" th:id="'data_admissao_'+${func.id}" name="data_admissao" placeholder="XX/XX/XXXX" required>
                                                </div>
                                                <div class="campo">
                                                    <label for="cargo">Cargo</label>
                                                    <input type="text" th:value="${func.cargo}" th:id="'cargo_'+${func.id}" name="cargo" required>
                                                </div>
                                                <div class="campo">
                                                    <label for="departamento">Departamento</label>
                                                    <input type="text" th:value="${func.nomeDepartamento}" th:id="'departamento_'+${func.id}" name="departamento" required>
                                                </div>
                                                <div class="campo">
                                                    <label for="salario">Salário</label>
                                                    <input type="text" th:value="${func.salario}" th:id="'salario_'+${func.id}" name="salario" required>
                                                </div>
                                            </div>
                                            <div class="linha">
                                                <div class="campo campo_email">
                                                    <label for="email">E-Mail</label>
                                                    <input type="email" th:value="${func.email}" th:id="'email_'+${func.id}" name="email" required>
                                                </div>
                                                <div class="campo campo_senha">
                                                    <label for="senha">Senha</label>
                                                    <input type="password" id="senha" name="senha" >
                                                </div>
                                            </div>
                                            <div id="botoes">
                                                <button type="button" th:onclick=" 'remover(' + ${func.id} + ')' " id="remover">REMOVER</button>
                                                <button type="submit" th:onclick=" 'salvarEstadoAtual(' + ${func.id} + ')' " id="salvar">SALVAR</button>
                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- FIM DO ACCORDION -->
                    </div>

                    <!-- MODAL DE CONFIRMAÇÃO DE ENVIO -->
                    <div class="modal fade" id="meuModal" tabindex="-1">
                        <div class="modal-dialog modal-dialog-centered">
                            <div class="modal-content">

                                <div class="modal-header">
                                    <h3 class="modal-title" id="tituloModal"></h3>

                                    <button type="button"
                                            class="btn-close"
                                            data-bs-dismiss="modal">
                                    </button>
                                </div>

                                <div id="conteudoModal" class="modal-body d-flex gap-4">
                                    
                                    
                                </div>

                            </div>
                        </div>
                    </div>

                </div>
            </section>
        </main>

        
    </body>

    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/barra_superior.js}"></script>
    <script th:src="@{/js/quadro_funcionarios.js}"></script>
</html>
