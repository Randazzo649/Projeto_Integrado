<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/bootstrap.min.css">
    <link rel="stylesheet" href="../static/css/personalizacao_funcionario.css">
    <title>UnitHub</title>
</head>

<body>
    <header>
        <div id="superior" th:style=" 'background-color: ' + ${e.getCor} + ';'" class="d-flex justify-content-between align-items-center px-5 py-3">
            <div>
                <img th:src="@{${e.getFoto}}" alt="" id="logo">
            </div>
            <div id="usuario_infos"> <button id="usuario_foto"><img th:src="@{/imgs/foto.png}" alt=""></button> 
                <span th:text="${u.nome}">nome</span>
            </div>
        </div>
    </header>
    <main>
        <div class="d-flex align-item-center flex-column justify-content-center titulos">
            <div class="d-flex align-items-center justify-content-between">
                <h1><strong>SEU HUB</strong></h1>
                <button type="button" id="voltar">VOLTAR</button>
            </div>
            <h2>PERFIL</h2>
        </div>
        <section id="perfil">
            <div id="item-funcionario" class="accordion">
                <div class="accordion-item">
                    <h2 class="accordion-header" id="cabecalho-funcionario">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse"
                            data-bs-target="#funcionario" aria-expanded="true" aria-controls="funcionario">
                            <div class="funcionario-header">
                                <strong id="nome_cabecalho" th:text="${u.nome}">
                                    NOME DO FUNCIONÁRIO
                                </strong>
                                <span id="departamento_cabecalho"> DEPARTAMENTO </span>
                            </div>
                        </button>
                    </h2>
                    <div id="funcionario" class="accordion-collapse collapse show" aria-labelledby="cabecalho-funcionario" data-bs-parent="#item-funcionario">
                        <div class="accordion-body">
                            <form id="formulario_perfil" method="post" enctype="multipart/form-data">
                                <div class="formulario-superior">
                                    <div class="campos-esquerda">
                                        <div class="campo">
                                            <label for="nome_valor">Nome</label>
                                            <span id="nome_valor" class="valor-estatico" th:text="${u.nome}">
                                                Nome Sobrenome Último Nome
                                            </span>
                                        </div>
                                        <div class="campo">
                                            <label for="pronomes">Pronomes</label>
                                            <select id="pronomes" name="pronomes">
                                                <option value=""></option>
                                                <option value="ele/dele">Ele/Dele</option>
                                                <option value="ela/dela">Ela/Dela</option>
                                                <option value="elu/delu">Elu/Delu</option>
                                                <option value="outros">Outros</option>
                                                <option value="nao_informar">Prefiro não informar</option>
                                            </select>
                                        </div>
                                        <div class="campo">
                                            <label>Aniversário</label>
                                            <div class="campo-com-privacidade">
                                                <span id="aniversario_valor" class="valor-estatico"> XX/XX/XXXX </span>
                                                <div class="opcoes-visibilidade">
                                                </div>
                                            </div>
                                        </div>
                                        <div class="campo">
                                            <label for="telefone">Telefone</label>
                                            <div class="campo-com-privacidade">
                                                <input type="tel" id="telefone" name="telefone">
                                            </div>
                                        </div>
                                        <div class="campo">
                                            <label>Departamento</label>
                                            <span id="departamento_valor" class="valor-estatico">
                                                Nome do Departamento
                                            </span>
                                        </div>
                                        <div class="campo">
                                            <label for="genero">Gênero</label>
                                            <div class="campo-com-privacidade">
                                                <select id="genero" name="genero">
                                                    <option value=""></option>
                                                    <option value="feminino">Feminino</option>
                                                    <option value="masculino">Masculino</option>
                                                    <option value="nao_binario">Não binário</option>
                                                    <option value="outro">Outro</option>
                                                    <option value="nao_informar">Prefiro não informar</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="campo-foto">
                                        <label for="foto_perfil">Foto de Perfil</label>
                                        <label for="foto_perfil" class="area-upload" id="area_upload">
                                            <div class="conteudo-upload" id="conteudo_upload">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="46" height="46"
                                                    viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                    stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                                                    <path
                                                        d="M3 8a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                                                    <path d="M3 10h18" />
                                                    <path d="M12 17v-5" />
                                                    <path d="m9.5 14.5 2.5-2.5 2.5 2.5" />
                                                </svg>
                                                <span class="texto-upload">
                                                    Clique ou Arraste e solte os seus arquivos aqui
                                                </span>
                                                <small>(PNG, SVG, PDF)</small>
                                            </div>
                                            <img src="" alt="Pré-visualização da foto de perfil" id="preview_foto" class="preview-foto" hidden>
                                        </label>
                                        <input type="file" id="foto_perfil" name="foto_perfil" accept=".png,.svg,.pdf" hidden>
                                        <button type="button" id="remover_foto" hidden>Remover arquivo</button>
                                    </div>
                                </div>
                                <div class="campo campo-sobre">
                                    <label for="sobre_voce">Sobre Você</label>
                                    <textarea id="sobre_voce" name="sobre_voce" rows="4" maxlength="1000"></textarea>
                                </div>
                                <div class="acoes-formulario">
                                    <button type="reset" class="btn-acao btn-cancelar">CANCELAR</button>
                                    <button type="submit" class="btn-acao btn-salvar">SALVAR</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script src="../static/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/personalizacao_funcionario.js"></script>
</body>

</html>
