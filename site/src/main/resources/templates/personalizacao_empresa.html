<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
        <link rel="stylesheet" th:href="@{/css/personalizacao_empresa.css}">
        <title>UnitHub</title>
    </head>
    <body>
        <header>
            <div id="superior" th:style=" 'background-color: ' + ${e.getCor} + ';'" class="d-flex justify-content-between align-items-center px-5 py-3">
                <div> <img th:src="@{${e.getFoto}}" alt="" id="logo"> </div>
                <div id="usuario_infos"> <button id="usuario_foto"><img th:src="@{/imgs/foto.png}" alt=""></button> <span th:text="${u.nome}" >nome</span> </div>
            </div>
        </header>
        <main>
            <h3><strong>DASHBOARD</strong></h3>
            <div class="opcoes">
                <h5>CONFIGURAÇÃO DE ECOSSISTEMA</h5>
                <div class="funcionalidades gap-5 h-100">
                    <div class="seletor_cor">
                        <h7>SELETOR DE COR</h7>
                        <div id="area_cor">
                            <div id="seletor_cor"></div>
                        </div>
                        <div id="barra_matriz">
                            <div id="seletor_matriz"></div>
                        </div>
                        <div class="campos_cor">
                            <div>
                                <label>HEX</label>
                                <input id="hex" type="text" readonly>
                            </div>
                            <div>
                                <label>RGB</label>
                                <input id="rgb" type="text"  readonly>
                            </div>
                            <div>
                                <label>HSL</label>
                                <input id="hsl" type="text" readonly>
                            </div>
                        </div>
                    </div>
                    <div class="d-flex flex-column justify-content-between">
                        <div class="alterar_logo">
                            <h3>ALTERAR LOGO</h3>
                            <input type="file" id="file_in">
                            <button id="alterar_logo_btn">
                                <img th:src="@{/imgs/upload.png}">
                                <p>
                                    <strong>
                                        Clique aqui para<br>
                                        alterar a logo da empresa<br>
                                    </strong>
                                    (PNG, SVG, PDF)<br>
                                    ideal: 230x50 px
                                </p>
                            </button>
                        </div>
                        <div class="d-flex w-100 flex-row justify-content-end p-5">
                            <input type="button" value="SALVAR" id="salvar_btn">
                        </div>
                    </div>
                </div>
            </div>

            <!-- MODAL DE CONFIRMAÇÃO DE ENVIO -->
            <div class="modal fade" id="meuModal" tabindex="-1">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">

                        <div class="modal-header">
                            <h3 class="modal-title" id="tituloModal"></h3>

                            <button type="button"
                                    class="btn-close"
                                    data-bs-dismiss="modal">
                            </button>
                        </div>

                        <div id="conteudoModal" class="modal-body d-flex gap-4">
                            
                            
                        </div>

                    </div>
                </div>
            </div>
        </main>
        <script th:src="@{/js/config.js}"></script>
        <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
        <script th:src="@{/js/editor_cor.js}"></script>
    </body>
</html>
