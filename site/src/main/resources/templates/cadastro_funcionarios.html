<!DOCTYPE html>
<html lang="pt-BR">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>UnitHub</title>

        <link rel="stylesheet" href="./quadro_funcionarios.css">
        <link rel="stylesheet" href="./bootstrap.min.css">
    </head>

    <body>

        <div id="superior" class="d-flex justify-content-between align-items-center px-5 py-3">
            <div>
                <img src="./NOME.png" alt="UnitHub" id="logo">
            </div>
            <div id="usuario_infos">
                <button type="button" id="usuario_foto">
                    <img src="" alt="">
                </button>

                <span>nome</span>
            </div>
        </div>

        <main>

            <div id="titulo_pagina">
                <h1>DASHBOARD</h1>
                <h3>QUADRO DE FUNCIONÁRIOS</h3>
            </div>

            <button type="button" id="registrar_funcionario">
                REGISTRAR NOVO FUNCIONÁRIO
            </button>

            <form id="form_funcionario">

                <div id="funcionario_header">
                    <div>
                        <strong>NOME DO FUNCIONÁRIO</strong>
                        <span>DEPARTAMENTO</span>
                    </div>
                    <span id="seta">▼</span>
                </div>

                <div id="formulario">
                    <div class="linha">
                        <div class="campo campo_nome">
                            <label for="nome">
                                Nome
                            </label>
                            <input type="text" id="nome" name="nome" placeholder="Nome Sobrenome Último Nome" required>
                        </div>
                        <div class="campo">
                            <label for="data_nascimento">
                                Data de Nascimento
                            </label>
                            <input type="text" id="data_nascimento" name="data_nascimento" placeholder="XX/XX/XXXX"
                                required>
                        </div>
                    </div>
                    <div class="linha">
                        <div class="campo">
                            <label for="cpf">CPF</label>
                            <input type="text" id="cpf" name="cpf" placeholder="XXX.XXX.XXX-XX" required>
                        </div>

                        <div class="campo">
                            <label for="genero">Gênero</label>
                            <input type="text" id="genero" name="genero">
                        </div>

                        <div class="campo">
                            <label for="telefone">Telefone</label>
                            <input type="text" id="telefone" name="telefone">
                        </div>
                    </div>
                    <div class="campo campo_endereco">
                        <label for="endereco">
                            <span>Endereço</span>
                            <small>Logradouro, Número, Complemento, Bairro, Cidade, Estado, CEP</small>
                        </label>
                        <input type="text" id="endereco" name="endereco" required>
                    </div>
                    <div class="linha">
                        <div class="campo">
                            <label for="data_admissao">Data de Admissão</label>
                            <input type="text" id="data_admissao" name="data_admissao" placeholder="XX/XX/XXXX" required>
                        </div>

                        <div class="campo">
                            <label for="cargo">Cargo</label>
                            <input type="text" id="cargo" name="cargo" required>
                        </div>

                        <div class="campo">
                            <label for="departamento">Departamento</label>
                            <input type="text" id="departamento" name="departamento" required>
                        </div>

                        <div class="campo">
                            <label for="salario">Salário</label>
                            <input type="text" id="salario" name="salario" required>
                        </div>
                    </div>

                    <div class="linha">
                        <div class="campo campo_email">
                            <label for="email">E-Mail</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        <div class="campo campo_senha">
                            <label for="senha">Senha</label>
                            <input type="password" id="senha" name="senha" required>
                        </div>
                    </div>

                    <div id="botoes">
                        <button type="button" id="remover">REMOVER</button>
                        <button type="submit" id="salvar">SALVAR</button>
                    </div>
                </div>
            </form>

        </main>

        <script src="../static/js/quadro_funcionarios.js"></script>

    </body>
</html>
