<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/personalizacao_usuario.css}">
    <title>UnitHub</title>
</head>

<body>
    <header>
        <div id="superior" th:style=" 'background-color: ' + ${e.getCor} + ';'" class="d-flex justify-content-between align-items-center px-5 py-3">
            <div>
                <img th:src="@{${e.getFoto}}" alt="" id="logo">
            </div>
            <div id="usuario_infos"> 
                <button id="usuario_foto" th:if="${u.foto != null}"><img id="usuario_foto_img" th:src="@{${u.foto}}" alt=""></button>
                <button id="usuario_foto" th:if="${u.foto == null}"><img id="usuario_foto_img" th:src="@{/imgs/foto.png}" alt=""></button> 
                <span th:text="${u.nome}">nome</span>
            </div>
        </div>
    </header>
    <main>
        <div class="d-flex align-item-center flex-column justify-content-center titulos">
            <div class="d-flex align-items-center justify-content-between">
                <h1><strong>SEU HUB</strong></h1>
                <button type="button" id="voltar">VOLTAR</button>
            </div>
            <h2>PERFIL</h2>
        </div>
        <section id="perfil">
            <div id="item-funcionario" class="accordion">
                <div class="accordion-item">
                    <h2 class="accordion-header" id="cabecalho-funcionario">
                        <button class="accordion-button" type="button" data-bs-toggle="collapse"
                            data-bs-target="#funcionario" aria-expanded="true" aria-controls="funcionario">
                            <div class="funcionario-header">
                                <strong id="nome_cabecalho" th:text="${u.nome}">
                                    NOME DO FUNCIONÁRIO
                                </strong>
                                <span id="departamento_cabecalho"> DEPARTAMENTO </span>
                            </div>
                        </button>
                    </h2>
                    <div id="funcionario" class="accordion-collapse collapse show" aria-labelledby="cabecalho-funcionario" data-bs-parent="#item-funcionario">
                        <div class="accordion-body">
                            <div id="formulario_perfil">
                                <div class="formulario-superior">
                                    <div class="campos-esquerda">
                                        <div class="campo">
                                            <label for="nome_valor">Nome</label>
                                            <div id="nome_valor" class="campo-com-privacidade">
                                                <input type="text" th:value="${u.nome}" id="nome" name="name">
                                            </div>
                                        </div>
                                        <div class="campo">
                                            <label for="funcao">Funcao</label>
                                            <div class="campo-com-privacidade">
                                                <input type="text" th:value="${u.funcao}" id="funcao" name="funcao">
                                            </div>
                                        </div>
                                        <div class="campo">
                                            <label for="email_valor">Email</label>
                                            <div id="email_valor" class="campo-com-privacidade">
                                                <input type="email" th:value="${u.email}" id="email" name="email">
                                            </div>
                                        </div>
                                        <div class="campo">
                                            <label for="Senha_valor">Senha</label>
                                            <div id="Senha_valor" class="campo-com-privacidade">
                                                <input type="password" id="senha" name="senha">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="campo-foto">
                                        <label for="foto_perfil">Foto de Perfil</label>
                                        <label for="foto_perfil" class="area-upload" id="area_upload">
                                            <div class="conteudo-upload" id="conteudo_upload">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="46" height="46"
                                                    viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                                    stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                                                    <path
                                                        d="M3 8a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                                                    <path d="M3 10h18" />
                                                    <path d="M12 17v-5" />
                                                    <path d="m9.5 14.5 2.5-2.5 2.5 2.5" />
                                                </svg>
                                                <span class="texto-upload">
                                                    Clique ou Arraste e solte os seus arquivos aqui
                                                </span>
                                                <small>(PNG, SVG, PDF)</small>
                                            </div>
                                            <img src="" alt="Pré-visualização da foto de perfil" id="preview_foto" class="preview-foto" hidden>
                                        </label>
                                        <input type="file" id="foto_perfil" name="foto_perfil" accept=".png,.jpg,.jpeg" hidden>
                                        <button type="button" id="remover_foto" hidden>Remover arquivo</button>
                                    </div>
                                </div>
                                <div class="acoes-formulario">
                                    <button type="reset" class="btn-acao btn-cancelar">CANCELAR</button>
                                    <button type="button" id="salvar_btn" class="btn-acao btn-salvar">SALVAR</button>
                                </div>
                            </div>

                            <!-- MODAL DE CONFIRMAÇÃO DE ENVIO -->
                            <div class="modal fade" id="meuModal" tabindex="-1">
                                <div class="modal-dialog modal-dialog-centered">
                                    <div class="modal-content">

                                        <div class="modal-header">
                                            <h3 class="modal-title" id="tituloModal"></h3>

                                            <button type="button"
                                                    class="btn-close"
                                                    data-bs-dismiss="modal">
                                            </button>
                                        </div>

                                        <div id="conteudoModal" class="modal-body d-flex gap-4">
                                            
                                            
                                        </div>

                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script th:src="@{/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/js/config.js}"></script>
    <script th:src="@{/js/personalizacao_usuario.js}"></script>
</body>

</html>
